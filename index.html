<html>
    <head>
        <style>
            .inputc {
                background-color: #eee;
                border: #ccc 1px  solid;
                width: 3em;
                padding: 10px;
            }

            button{
                background-color: #ff8000;
                width: 37px;
                height: 37px;
                font-size: 14px;
                color: white;
                border: #ccc;
            }

            .buttonLimp {
                width: 50px;
                font-size: 10px;
            }

            button:active {
                background-color: #ee5000;
            }

            .resq{
                background-color: white;
                width: 10em;
                height: 37px;
                border: #ccc;
            }

            .botoes button.operadores{
                background-color: blue;
                color: white;
            }

            .botoes button.ca{
                color: white;
                background-color: red;
            }

            .botoes{
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 5px;
                border-radius: 10px;
                padding: 10px;
                background-color: white;
            }

            .botoes button {
                background-color: brown;
                width: 37px;
                height: 37px;
                font-size: 14px;
                border-radius: 10px;
                color: white;
                border: 1px solid #ccc;
            }

            .calculadora {
                width: fit-content;
                padding: 10px;
                border: 5px solid grey;
                border-radius: 10px;
                background: #eee;
            }

            .botoes button.ca:hover{
                background-color: #ff9292;
            }
            .botoes button:hover{
                background-color: #ff7253;
            }
            .botoes button.operadores:hover{
                background-color: #8686ff;
            }
        </style>
    </head>

    <body>
        <!--Calculadora de botao-->
        <div class="calculadora">
            <input type="text" id="display" disabled>
            <div class="botoes">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operadores">/</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operadores">*</button>

                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operadores">-</button>

                <button>0</button>
                <button class="ca">CA</button>
                <button class="operadores">=</button>
                <button class="operadores">+</button>
            </div>
        </div>

        <br>

        <!--Calculadora de linha-->
        <!--Soma-->
        <input class="inputc" id="sa" placeholder="">
        <input class="inputc" id="sb" placeholder="">
        <button onclick="soma()">+</button>
        <input class="resq" id="sr">
        <button class="buttonLimp" onclick="limpaSoma()">Limpar</button><br>

        <!--Sub-->
        <input class="inputc" id="sasub" placeholder="">
        <input class="inputc" id="sbsub" placeholder="">
        <button onclick="sub()">-</button>
        <input class="resq" id="srsub">
        <button class="buttonLimp" onclick="limpaSub()">Limpar</button><br>

        <!--Mult-->
        <input class="inputc" id="samult" placeholder="">
        <input class="inputc" id="sbmult" placeholder="">
        <button onclick="mult()">*</button>
        <input class="resq" id="srmult">
        <button class="buttonLimp" onclick="limpaMult()">Limpar</button><br>

        <!--Div-->
        <input class="inputc" id="sadiv" placeholder="">
        <input class="inputc" id="sbdiv" placeholder="">
        <button onclick="div()">/</button>
        <input class="resq" id="srdiv">
        <button class="buttonLimp" onclick="limpaDiv()">Limpar</button><br>

        <script>
            const display = document.querySelector("#display");
            const botoes = document.querySelectorAll(".botoes button");

            botoes.forEach(botao => {
                botao.addEventListener("click", () => {
                    const valor = botao.textContent;

                    if(valor === "CA") {
                        display.value = "";
                    } else if(valor === "=") {
                        try {
                            display.value = eval(display.value);
                        } catch {
                            display.value = "Erro"; 
                        }
                    } else {
                        display.value += valor; 
                    }
                });
            });

            function soma(){
                var va = document.querySelector("#sa").value;
                var vb = document.querySelector("#sb").value;
                var resultado = parseInt(va) + parseInt(vb);
                document.querySelector("#sr").value = resultado;
            }

            function sub(){
                var va = document.querySelector("#sasub").value;
                var vb = document.querySelector("#sbsub").value;
                var resultado = parseInt(va) - parseInt(vb);
                document.querySelector("#srsub").value = resultado;
            }

            function mult(){
                var va = document.querySelector("#samult").value;
                var vb = document.querySelector("#sbmult").value;
                var resultado = parseInt(va) * parseInt(vb);
                document.querySelector("#srmult").value = resultado;
            }

            function div(){
                var va = document.querySelector("#sadiv").value;
                var vb = document.querySelector("#sbdiv").value;
                var resultado = parseFloat(va) /  parseFloat(vb);
                document.querySelector("#srdiv").value = resultado;
            }

            function limpaSoma(){
                document.querySelector("#sa").value = "";
                document.querySelector("#sb").value = "";
                document.querySelector("#sr").value = "";                
            }

            function limpaSub(){
                document.querySelector("#sasub").value = "";
                document.querySelector("#sbsub").value = "";
                document.querySelector("#srsub").value = "";
            }
                
            function limpaMult(){
                document.querySelector("#samult").value = "";
                document.querySelector("#sbmult").value = "";
                document.querySelector("#srmult").value = "";
            }

            function limpaDiv(){
                document.querySelector("#sadiv").value = "";
                document.querySelector("#sbdiv").value = "";    
                document.querySelector("#srdiv").value = "";
            }

            
        </script>
    </body>
</html>
